<!doctype html><html lang="es"><head><meta charset="utf-8"><style>.tab-pane{display:none}.tab-pane.active{display:block}.dependent{display:none}.nav-tabs{display:flex;gap:20px}.form-group{margin:15px}</style></head><body>
<form id="expediente"><nav class="nav-tabs"><a id="tab-cliente" class="active" data-toggle="tab" href="#cliente">Cliente</a><a id="tab-pedido" data-bs-toggle="tab" href="#pedido">Pedido</a><a id="tab-economicos" data-toggle="tab" href="javascript:void(0);" aria-controls="#datos-económicos">Económicos</a></nav>
<section id="cliente" class="tab-pane active"><label for="nombre">Nombre</label><input id="nombre" value="Original"><label for="numero">Número id. personal</label><input id="numero"><input type="password" id="password" value="no-leer"><input type="hidden" id="token" value="no-leer">
<div class="form-group"><label>DNI en vigor</label><label><input type="radio" name="vigencia" id="vigente" value="1">Fecha en vigor</label><label><input type="radio" name="vigencia" id="caducado" value="0">Caducado</label></div>
<label for="numerosa">Familia numerosa</label><input type="checkbox" id="numerosa">
<button id="switch" type="button" role="switch" aria-checked="false">Servicios conectados</button><label for="dni-file">DNI adjunto</label><input id="dni-file" type="file" style="display:none" accept="application/pdf,image/png">
</section>
<section id="pedido" class="tab-pane"><div class="form-group"><label>Forma de pago</label><label><input type="radio" name="pago" id="contado" value="cash" checked>Contado</label><label><input type="radio" name="pago" id="financiado" value="loan">Financiado</label></div><div id="financiacion" class="dependent"><label for="banco">Banco</label><input id="banco"><label for="producto">Producto financiero</label><select id="producto"><option value="">Elegir</option><option value="normal">Normal</option><option value="aval">Con aval</option></select><div id="avalista-wrap" class="dependent"></div></div><div id="lazy"></div></section>
<section id="datos-económicos" class="tab-pane">
<div class="form-group"><label>Ayuda configurable</label><label><input type="radio" id="__BVID__10" name="__BVID__11" value="yes">Sí</label><label><input type="radio" id="__BVID__12" name="__BVID__11" value="no">No</label></div>
<div class="form-group"><label for="catalogo">Catálogo</label><select class="select2-hidden-accessible" id="catalogo" style="display:none"><option value="">Elegir</option><option value="dacia">Dacia</option></select><span class="select2-container"><span role="combobox">Dacia</span></span></div>
<h2>Pedido (*) <button type="button">Subir fichero</button><input type="file" id="pedido-file" hidden></h2>
<div class="modal"><label for="modal-field">Dato del modal</label><input id="modal-field"></div>
</section><button type="submit" id="save">Guardar Expediente</button><button type="button" id="cancel">Anular expediente</button></form>
<script>
window.saves=0;window.cancels=0;document.querySelector('form').onsubmit=e=>{e.preventDefault();window.saves++};document.querySelector('#cancel').onclick=()=>window.cancels++;
for(const tab of document.querySelectorAll('.nav-tabs a'))tab.onclick=e=>{e.preventDefault();for(const t of document.querySelectorAll('.nav-tabs a'))t.classList.remove('active');for(const panel of document.querySelectorAll('.tab-pane'))panel.classList.remove('active');tab.classList.add('active');document.getElementById((tab.getAttribute('aria-controls')||tab.getAttribute('href')).replace(/^#/, '')).classList.add('active');if(tab.id==='tab-pedido')setTimeout(()=>{if(!document.querySelector('#matricula'))document.querySelector('#lazy').innerHTML='<label for="matricula">Matrícula</label><input id="matricula">'},40);};
for(const radio of document.querySelectorAll('[name=pago]'))radio.onchange=()=>document.querySelector('#financiacion').style.display=document.querySelector('#financiado').checked?'block':'none';
document.querySelector('#producto').onchange=()=>{const wrap=document.querySelector('#avalista-wrap');wrap.style.display=document.querySelector('#producto').value==='aval'?'block':'none';if(document.querySelector('#producto').value==='aval'&&!document.querySelector('#avalista'))wrap.innerHTML='<label for="avalista">Avalista</label><input id="avalista">';};
document.querySelector('#switch').onclick=e=>e.target.setAttribute('aria-checked',e.target.getAttribute('aria-checked')==='true'?'false':'true');
</script></body></html>
